async function supa(method,table,body,params=""){
  const url=SUPA_URL+"/rest/v1/"+table+(params?"?"+params:"");
  const isUpsert=method==="POST"&&params.includes("on_conflict");
  const prefer=isUpsert?"return=representation,resolution=merge-duplicates":"return=representation";
  const headers={"apikey":SUPA_KEY,"Authorization":"Bearer "+SUPA_KEY,"Content-Type":"application/json","Prefer":prefer};
  const r=await fetch(url,{method,headers,body:body?JSON.stringify(body):undefined});
  if(!r.ok){const e=await r.text();throw new Error(r.status+": "+e);}
  const txt=await r.text();
  return txt?JSON.parse(txt):null;
}

async function mockAi(sys,msg){await new Promise(r=>setTimeout(r,900));if(sys.includes("perspectiva")||sys.includes("INSIGHT")){const st=msg.includes("conflitante")?"conflitante":msg.includes("tacito")||msg.includes("tácito")?"tacito":msg.includes("inexistente")?"inexistente":"expresso";return DEMO_INSIGHTS[st]||DEMO_INSIGHTS.tacito;}if(sys.includes("COMPARE")||sys.includes("Área:")){return{analise:"Há uma diferença de percepção que é comum em casais: cada um tem um mapa diferente da mesma realidade. Isso não significa que alguém está errado.",perguntas:["O que cada um entende como 'combinado' nesta área?","Há alguma decisão recente que ficou sem conversa?","Qual seria um primeiro acordo concreto e pequeno que ambos conseguiriam honrar?"],sugestao:"Vamos definir juntos como vamos lidar com este tema. [Edite aqui o texto do acordo]"};}if(sys.includes("compromissos")){return{compromissos:[{id:"c1",desc:"Conversar sobre o tema uma vez por semana",dono:"ambos",frequencia:"semanal"},{id:"c2",desc:"Tomar decisões importantes juntos antes de agir",dono:"ambos",frequencia:"quando_ocorrer"}]};}if(sys.includes("CNV")){return"Observo: [descreva o fato]\n\nSinto: [nomeie a emoção]\n\nNecessito: [nomeie a necessidade]\n\nPeço: [pedido concreto e positivo]";}if(sys.includes("dicas")){return{dicas:["Definam juntos o que 'sucesso' significa para este projeto","Estabeleçam marcos intermediários para celebrar progresso","Combinem como vão lidar com desvios do plano original"]};}return{padrao:"Você demonstra uma tendência a assumir responsabilidade pelo bem-estar do outro antes de atender às próprias necessidades.",recurso:"Sua capacidade de observar padrões nas relações é um recurso valioso que já está disponível em você.",gesto:"Esta semana, antes de responder ao pedido do parceiro, pergunte-se: 'O que eu genuinamente preciso agora?'",frase_final:"Cuidar de si não é egoísmo — é a condição para que você possa estar presente de verdade com quem ama."};}

async function callApi(sys,msg,tok=1400){const key=getKey();if(!key)return null;try{const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-allow-browser":"true"},body:JSON.stringify({model:MODEL,max_tokens:tok,system:sys,messages:[{role:"user",content:msg}]})});const d=await r.json();if(d.error)return null;const txt=(d.content||[]).filter(b=>b&&b.type==="text").map(b=>b.text).join("\n").trim();return txt||null;}catch(e){return null;}}
async function ai(sys,msg,tok=1400){if(DEMO_MODE)return await mockAi(sys,msg);const t=await callApi(sys,msg,tok);if(!t)return{error:true};try{return JSON.parse(t.replace(/```json|```/g,"").trim());}catch(e){return{error:true,raw:t};}}
async function aiText(sys,msg,tok=600){if(DEMO_MODE)return await mockText(sys,msg);return await callApi(sys,msg,tok)||"";}

const setIntroPast=()=>{try{localStorage.setItem(CNV_INTRO_KEY,"1");}catch(e){}};
const[fase,setFase]=useState(()=>prefill?"cnv":(introPast()?"livre":"intro"));
const[step,setStep]=useState(0);
const[textoLivre,setTextoLivre]=useState("");
const[data,setData]=useState({observo:prefill?.campo==="observo"?prefill.texto:"",sinto:"",necessito:"",peco:""});
const[showLonga,setShowLonga]=useState(false);
const[showEmoc,setShowEmoc]=useState(false);
const[showNeeds,setShowNeeds]=useState(false);
const[revisao,setRevisao]=useState(null);
const[loading,setLoading]=useState(false);

const[enviado,setEnviado]=useState(false);
const myRole=isDemo?active:role;
const outro=myRole==="p1"?"p2":"p1";
const s=CNVSTEPS[step];
const canNext=data[s?.id]?.trim();

const reset=()=>{if(onClearPrefill)onClearPrefill();setFase(introPast()?"livre":"intro");setStep(0);setTextoLivre("");setData({observo:"",sinto:"",necessito:"",peco:""});setRevisao(null);setVersaoEsc("refinada");setEnviado(false);setShowEmoc(false);setShowNeeds(false);setShowLonga(false);};

const gerarRevisao=async()=>{
  setLoading(true);setFase("revisao");
  let r;
  if(DEMO_MODE){
    await new Promise(res=>setTimeout(res,1400));
    const vagos=Object.entries({observo:data.observo,sinto:data.sinto,necessito:data.necessito,peco:data.peco}).filter(([,v])=>!v||v.trim().length<25).map(([k])=>k);
    r=vagos.length>0?{precisa_contexto:true,orientacao:"Para oferecer uma análise útil sem presumir nada, preciso de um pouco mais de detalhes nos campos indicados. Quanto mais concreto você for — sem julgamentos, apenas os fatos e o que você sentiu — mais a revisão vai refletir sua realidade, não uma situação inventada.",campos:vagos}:DEMO_CNV_REVIEW;
  } else r=await ai(SYS_CNV_REVIEW,"Observo: "+data.observo+"\nSinto: "+data.sinto+"\nNecessito: "+data.necessito+"\nPeço: "+data.peco);
  setRevisao(r?.error?null:r);setLoading(false);
};

const textoEnvio=revisao?(versaoEsc==="refinada"?revisao.versao_refinada:revisao.versao_original):"Observo: "+data.observo+"\n\nSinto: "+data.sinto+"\n\nNecessito: "+data.necessito+"\n\nPeço: "+data.peco;

{isDemo&&<PT casal={casal} active={active} set={setActive} isDemo={isDemo}/>}

<p style={{fontSize:14,lineHeight:1.8,color:C.accent,margin:"0 0 14px",fontStyle:"italic"}}>Lembre: ninguém tem percepção telepática do que você precisa — nem deveria ter.</p>
{!showLonga&&<button onClick={()=>setShowLonga(true)} style={{background:"transparent",border:"none",color:C.accent,fontSize:13,cursor:"pointer",fontFamily:SF,padding:"0 0 14px",display:"block"}}>Saiba mais sobre a técnica ↓</button>}
{showLonga&&<div style={{background:"#edf5ef",borderRadius:12,padding:14,marginBottom:14}}><p style={{fontSize:13,lineHeight:1.8,color:C.text,margin:"0 0 8px"}}>A técnica tem quatro etapas: você descreve o que observou (fatos concretos), nomeia o que sente (emoção real), identifica a necessidade por trás do sentimento, e faz um pedido concreto e realizável.</p><p style={{fontSize:13,lineHeight:1.8,color:C.text,margin:0}}>Ao final, a IA revisa sua mensagem e oferece uma versão refinada — explicando cada ajuste. É uma oportunidade de aprendizado sobre si mesmo, não uma correção.</p></div>}
<div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
<Btn onClick={()=>setFase("livre")} style={{flex:1}}>Começar →</Btn>
<Btn outline onClick={()=>{setIntroPast();setFase("livre");}} sm>Não mostrar novamente</Btn>
</div>
</Card></Wrap></div>;

<Card>

function Checkin({casal,active,setActive,go,checkins,setCheckins,sessao,isDemo,role,onSaveCheckin}){

const[conexaoRota,setConexaoRota]=useState(null);
const todayD=checkins[today]||{};const myDone=!!todayD[myRole];const[saved,setSaved]=useState(false);
const avg=d=>d?((DIMS.reduce((a,x)=>a+(d[x.id]||3),0))/DIMS.length).toFixed(1):null;
const save=()=>{const nd={...checkins,[today]:{...todayD,[myRole]:{...form}}};setCheckins(nd);onSaveCheckin(myRole,today,form);setSaved(true);};
const shareNota=()=>{const updOther={...todayD[other],notaRecebida:{de:casal[myRole],texto:todayD[myRole].nota}};setCheckins(p=>({...p,[today]:{...p[today],[other]:updOther}}));onSaveCheckin(other,today,updOther);};

    botoes={[{label:"Explorar Meu Enredo →",onClick:()=>go("enredo")}]}/>;
  if(id==="abertura")return<CIAlerta key="abertura" cor="#5a7a9a" bg="#f0f4f9"
    texto="Quando a abertura está baixa, pode ser difícil ouvir — e qualquer conversa mais densa tende a piorar. Nessas horas, aguardar um momento mais sereno costuma trazer melhores resultados. Uma pergunta que às vezes ajuda: o que me fez escolher esse parceiro? Às vezes reconectar com esses motivos é o que nos tira de um lugar mais reativo."
    botoes={[{label:"Explorar Meu Enredo →",onClick:()=>go("enredo")}]}/>;

const tema=TE.find(t=>t.id===sel);

4,lineHeight:1.8,margin:0,fontWeight:600,color:C.primary}}>{sint.gesto}</p></Card>}{sint.frase_final&&<div style={{background:tema.cor+"0c",borderRadius:14,padding:20,textAlign:"center",fontStyle:"italic",fontSize:15,color:tema.cor,lineHeight:1.7,fontFamily:GF}}>"{sint.frase_final}"</div>}</div>}</Wrap></div>;
return<div style={{minHeight:"100vh",background:C.bg,fontFamily:GF}}><Hdr title="📖 Meu Enredo" sub="Auto-reflexão e autoconhecimento" onBack={()=>go("home")}/><Wrap>

{TE.map(t=><div key={t.id} onClick={()=>{setSel(t.id);setSint(null);setResp({});}} style={{background:C.card,borderRadius:18,padding:"16px 14px",marginBottom:10,boxShadow:"0 1px 8px rgba(0,0,0,0.05)",borderLeft:`3px solid ${t.cor}`,cursor:"pointer"}}><div style={{display:"flex",alignItems:"center",gap:13}}><div style={{width:44,height:44,borderRadius:13,background:t.cor+"15",display:"flex",alignItems:"center",justifyContent:"center",fontSize:22,flexShrink:0}}>{t.icon}</div><div style={{flex:1}}><div style={{display:"flex",alignItems:"center",gap:8,marginBottom:3}}><div style={{fontWeight:700,fontSize:15}}>{t.label}</div>{feito[t.id]&&<span style={{fontSize:11,color:C.green,fontWeight:600,fontFamily:SF}}>Concluído</span>}</div><div style={{fontSize:13,color:C.muted,fontFamily:SF}}>{t.sub}</div></div><div style={{color:t.cor,fontSize:18,opacity:.6}}>›</div></div></div>)}</Wrap></div>;}

function Leituras({casal,go,acordos}){const[tsel,setTsel]=useState(null);const[leitura,setLeitura]=useState(null);const[loading,setLoading]=useState(false);const[lidas,setLidas]=useState({});const[reflex,setReflex]=useState("");const[salvou,setSalvou]=useState(false);

const slistas=tsel?LBASE.filter(s=>s.tema===tsel):LBASE;
const abrir=async sug=>{if(lidas[sug.titulo]){setLeitura(lidas[sug.titulo]);setReflex("");setSalvou(false);return;}setLoading(sug.titulo);const t=LTEMAS.find(t=>t.id===sug.tema);const d=await ai(`Divulgador científico. APENAS JSON: {"titulo":"titulo","subtitulo":"frase instigante","corpo":"artigo 4-5 parágrafos separados por \\n\\n","pesquisadores":"autores","pergunta_reflexao":"pergunta aberta","tempo_leitura":"X min"}`,`Escreva sobre: ${sug.titulo}`,1600);const art={...(d.error?{titulo:sug.titulo,subtitulo:"",corpo:"Conteúdo indisponível — verifique a chave de API.",pesquisadores:"",pergunta_reflexao:"",tempo_leitura:"—"}:d),titulo:sug.titulo,tema:sug.tema,cor:t?.cor||C.accent};setLidas(p=>({...p,[sug.titulo]:art}));setLeitura(art);setLoading(false);setReflex("");setSalvou(false);};

return<div style={{minHeight:"100vh",background:C.bg,fontFamily:GF}}><Hdr title="📚 Leituras" sub="Conteúdo baseado em pesquisa" onBack={()=>go("home")}/><Wrap>
{temasSug.length>0&&<div style={{background:"#edf5ef",borderRadius:14,padding:12,marginBottom:16}}><div style={{fontSize:12,fontWeight:600,color:C.accent,marginBottom:8,fontFamily:SF}}>Sugerido com base nos seus acordos</div><div style={{display:"flex",gap:8,flexWrap:"wrap"}}>{[...new Set(temasSug)].map(t=>{const lt=LTEMAS.find(x=>x.id===t);return lt?<Tag key={t} color={lt.cor} label={lt.icon+" "+lt.label}/>:null;})}</div></div>}

const ordenados=marcos.slice().sort((a,b)=>ordem==="desc"?b.data_evento>a.data_evento?1:-1:a.data_evento>b.data_evento?1:-1);

const abrirEdit=(m)=>{setEditId(m.id);setForm({titulo:m.titulo,data_evento:m.data_evento,precisao_data:m.precisao_data||"dia",categoria:m.categoria||"outro",nota:m.nota||"",reminder:m.reminder||false,reminder_tom:m.reminder_tom||"carinhoso"});setFormSalvo(false);setView("form");};

const salvar=async()=>{
  if(!form.titulo.trim()||!form.data_evento)return;
  setSalvando(true);
  await onSaveMarco({...(editId?{id:editId}:{}),titulo:form.titulo.trim(),data_evento:form.data_evento,precisao_data:form.precisao_data,categoria:form.categoria,nota:form.nota.trim()||null,reminder:form.reminder,reminder_tom:form.reminder?form.reminder_tom:null});

const fmtMarcoData=(m)=>{
  const d=new Date(m.data_evento+"T12:00:00");
  if(m.precisao_data==="ano")return d.getFullYear().toString();
  if(m.precisao_data==="mes")return d.toLocaleDateString("pt-BR",{month:"long",year:"numeric"});

};

</div>
<input type="date" value={form.data_evento} onChange={e=>setForm(f=>({...f,data_evento:e.target.value}))} style={{width:"100%",padding:"10px 12px",borderRadius:12,border:`1.5px solid ${C.border}`,fontSize:14,color:C.text,background:"#FAFBF9",outline:"none",fontFamily:SF,marginBottom:12}}/>
<p style={{fontWeight:700,marginBottom:8,color:C.primary}}>Categoria</p>
<div style={{display:"flex",flexWrap:"wrap",gap:7,marginBottom:12}}>
  {MCATS.map(cat=><button key={cat.id} onClick={()=>setForm(f=>({...f,categoria:cat.id}))} style={{padding:"7px 12px",borderRadius:20,border:`1.5px solid ${form.categoria===cat.id?C.primary:C.border}`,background:form.categoria===cat.id?C.primary+"12":"transparent",color:form.categoria===cat.id?C.primary:C.muted,fontSize:12,cursor:"pointer",fontFamily:SF,fontWeight:form.categoria===cat.id?700:400}}>{cat.icon} {cat.label}</button>)}
</div>
<p style={{fontWeight:700,marginBottom:8,color:C.primary}}>Nota <span style={{fontWeight:400,color:C.muted,fontSize:12}}>(opcional)</span></p>
<TA value={form.nota} onChange={v=>setForm(f=>({...f,nota:v}))} rows={2} ph="Um detalhe que queira lembrar..."/>
</Card>
<Card>
<div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
  <p style={{fontWeight:700,margin:0,color:C.primary}}>🔔 Lembrete anual</p>
  <div onClick={()=>setForm(f=>({...f,reminder:!f.reminder}))} style={{width:44,height:24,borderRadius:12,background:form.reminder?C.accent:C.border,cursor:"pointer",position:"relative",transition:"background .2s"}}><div style={{position:"absolute",top:3,left:form.reminder?20:3,width:18,height:18,borderRadius:9,background:"#fff",transition:"left .2s",boxShadow:"0 1px 4px rgba(0,0,0,0.2)"}}/></div>
</div>
<p style={{fontSize:12,color:C.muted,fontFamily:SF,marginBottom:form.reminder?12:0}}>Aparecer na Home todo ano nesta data</p>
{form.reminder&&<><p style={{fontWeight:600,fontSize:12,color:C.primary,marginBottom:6,fontFamily:SF}}>Tom da mensagem</p><div style={{display:"flex",gap:8}}>{["celebrativo","reflexivo","carinhoso"].map(t=><button key={t} onClick={()=>setForm(f=>({...f,reminder_tom:t}))} style={{flex:1,padding:"7px 0",borderRadius:10,border:`1.5px solid ${form.reminder_tom===t?C.accent:C.border}`,background:form.reminder_tom===t?C.accent+"15":"transparent",color:form.reminder_tom===t?C.accent:C.muted,fontSize:12,cursor:"pointer",fontFamily:SF,fontWeight:form.reminder_tom===t?700:400,textTransform:"capitalize"}}>{t}</button>)}</div></>}
</Card>
{formSalvo?<div style={{textAlign:"center",padding:"16px 0",color:C.accent,fontWeight:700,fontFamily:GF}}>✓ Marco salvo!</div>:<Btn onClick={salvar} disabled={!form.titulo.trim()||!form.data_evento||salvando} style={{width:"100%"}}>{salvando?"Salvando...":"Salvar marco →"}</Btn>}
</Wrap></div>;

return<div style={{minHeight:"100vh",background:C.bg,fontFamily:GF}}>

  <div><div style={{color:"rgba(255,255,255,0.6)",fontSize:11,fontFamily:SF,marginBottom:4}}>{marcos.length} marco{marcos.length!==1?"s":""} registrado{marcos.length!==1?"s":""}</div><div style={{color:"#fff",fontSize:14,fontFamily:SF}}>A história que vocês estão escrevendo juntos.</div></div>
  <button onClick={abrirNovo} style={{background:"rgba(255,255,255,0.15)",border:"1.5px solid rgba(255,255,255,0.4)",borderRadius:12,padding:"8px 14px",color:"#fff",fontSize:13,cursor:"pointer",fontFamily:GF}}>+ Novo</button>
</div>
</div>
<Wrap>
{marcos.length===0?<Card style={{textAlign:"center",padding:40}}><div style={{fontSize:40,marginBottom:12}}>📜</div><p style={{fontWeight:700,marginBottom:8,fontSize:16}}>Toda história começa em algum lugar.</p><p style={{fontSize:14,color:C.muted,fontFamily:SF,marginBottom:20,lineHeight:1.7}}>Quando foi o primeiro capítulo de vocês?</p><Btn onClick={abrirNovo}>Registrar primeiro marco →</Btn></Card>:
<><div style={{display:"flex",justifyContent:"flex-end",marginBottom:12}}><button onClick={()=>setOrdem(o=>o==="desc"?"asc":"desc")} style={{background:"transparent",border:`1px solid ${C.border}`,borderRadius:20,padding:"6px 12px",fontSize:11,color:C.muted,cursor:"pointer",fontFamily:SF}}>{ordem==="desc"?"↓ Mais recente":"↑ Mais antigo"}</button></div>

  </div>
  <div onClick={()=>abrirEdit(m)} style={{flex:1,background:C.card,borderRadius:16,padding:"12px 14px",marginBottom:8,cursor:"pointer",boxShadow:"0 1px 6px rgba(0,0,0,0.04)"}}>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:4}}>
      <div style={{fontWeight:700,fontSize:14,color:C.text,flex:1,lineHeight:1.4}}>{m.titulo}</div>
      {m.reminder&&<span style={{fontSize:12,marginLeft:6,flexShrink:0}}>🔔</span>}
    </div>
    <div style={{fontSize:11,color:C.muted,fontFamily:SF,marginBottom:m.nota?6:0}}>{fmtMarcoData(m)} · {cat.label}</div>
    {m.nota&&<div style={{fontSize:12,color:C.muted,fontFamily:SF,fontStyle:"italic",lineHeight:1.5}}>{m.nota}</div>}

<button onClick={abrirNovo} style={{background:"transparent",border:`1.5px dashed ${C.border}`,borderRadius:14,padding:"11px 0",width:"100%",color:C.muted,fontSize:14,cursor:"pointer",fontFamily:GF,marginTop:8}}>+ Novo marco</button></>}

/* ============ APP ============ */
function App(){
  const[sess,setSessState]=useState(null);
  const[loadingData,setLoadingData]=useState(false);
  const[casal,setCasal]=useState(null);
  const[active,setActive]=useState("p1");
  const[screen,setScreen]=useState("home");
  const[acordos,setAcordos]=useState({});
  const[projetos,setProjetos]=useState([]);
  const[checkins,setCheckins]=useState({});
  const[customAreas,setCustomAreas]=useState([]);
  const[sessao,setSessao]=useState(null);
  const[tOk,setTOk]=useState(false);
  const[onboarded,setOnboarded]=useState(false);
  const[showSplash,setShowSplash]=useState(true);
  const[syncTime,setSyncTime]=useState("");
  const[loadError,setLoadError]=useState(false);
  const[marcos,setMarcos]=useState([]);
  const[cnvPrefill,setCnvPrefill]=useState(null);
  const[historiaPrefill,setHistoriaPrefill]=useState(null);

  const loadData=async(casal_id,opts={})=>{
    if(!opts.silent)setLoadingData(true);
    setLoadError(false);
    try{
      const[a,c,p,m]=await Promise.all([db.loadAcordos(casal_id),db.loadCheckins(casal_id),db.loadProjetos(casal_id),db.loadMarcos(casal_id)]);
      setAcordos(a);setCheckins(c);setProjetos(p);setMarcos(m||[]);
      setSyncTime(new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"}));
    }catch(e){console.error("loadData:",e);setLoadError(true);}
    if(!opts.silent)setLoadingData(false);
  };

  useEffect(()=>{
    const s=getSess();
    if(s&&!s.isDemo){
      setSessState(s);
      setCasal({p1:s.nome_p1,p2:s.nome_p2||"Parceiro(a)"});
      setActive(s.role==="terapeuta"?"p1":s.role);
      setShowSplash(false);
      setCustomAreas(getCAreas(s.casal_id));
      if(s.role==="terapeuta"){setOnboarded(true);setScreen("terapeuta");}
      else if(compDone(s.casal_id))setOnboarded(true);
      loadData(s.casal_id);
    }
  },[]);

  /* Polling automático a cada 90s (apenas modo real) — silencioso e pausado em segundo plano */
  useEffect(()=>{
    if(!sess||sess.isDemo||!sess.casal_id)return;
    const iv=setInterval(()=>{if(!document.hidden)loadData(sess.casal_id,{silent:true});},90000);
    return()=>clearInterval(iv);
  },[sess?.casal_id,sess?.isDemo]);

  const handleSession=(s)=>{
    setSessState(s);
    if(s.isDemo){
      DEMO_MODE=!s.hasKey;
      setCasal({p1:"Você",p2:"Parceiro(a)"});
      setActive("p1");
      setOnboarded(false); /* sempre mostrar onboarding no demo */
      setScreen("home");
      setShowSplash(false);
    }else{
      setCasal({p1:s.nome_p1,p2:s.nome_p2||"Parceiro(a)"});
      setActive(s.role==="terapeuta"?"p1":s.role);
      setShowSplash(false);
      setCustomAreas(getCAreas(s.casal_id));
      if(s.role==="terapeuta"){setOnboarded(true);setScreen("terapeuta");}
      else if(compDone(s.casal_id))setOnboarded(true);
      loadData(s.casal_id);
    }
  };

  /* Item 7: persiste áreas personalizadas por casal (interim, por dispositivo) */
  useEffect(()=>{
    if(sess&&!sess.isDemo&&sess.casal_id)setCAreas(sess.casal_id,customAreas);
  },[customAreas,sess?.casal_id,sess?.isDemo]);

  const isDemo=!sess||sess.isDemo;
  const role=sess?.role||"p1";

  const onSaveAcordo=(areaId,data)=>{if(!isDemo&&sess?.casal_id)db.saveAcordo(sess.casal_id,areaId,data).catch(console.error);};
  const onSaveCheckin=(r,date,data)=>{if(!isDemo&&sess?.casal_id)db.saveCheckin(sess.casal_id,r,date,data).catch(console.error);};
  const onSaveProjeto=async(p)=>{if(!isDemo&&sess?.casal_id){const newId=await db.saveProjeto(sess.casal_id,p).catch(console.error);if(newId&&p.id!==newId)setProjetos(pr=>pr.map(x=>x.id===p.id?{...x,id:newId}:x));}};
  const onDelProjeto=(id)=>{if(!isDemo&&sess?.casal_id)db.delProjeto(id).catch(console.error);};
  const onSaveMarco=async(marco)=>{
    if(!isDemo&&sess?.casal_id){
      const saved=await db.saveMarco(sess.casal_id,marco,role).catch(console.error);
      if(saved&&!marco.id){setMarcos(m=>[...m,saved].sort((a,b)=>a.data_evento>b.data_evento?1:-1));}
      else{setMarcos(m=>m.map(x=>x.id===marco.id?{...x,...marco}:x));}
    } else {
      if(!marco.id){const tmp={...marco,id:"tmp_"+Date.now()};setMarcos(m=>[...m,tmp].sort((a,b)=>a.data_evento>b.data_evento?1:-1));}
      else{setMarcos(m=>m.map(x=>x.id===marco.id?{...x,...marco}:x));}
    }
  };
  const onSync=()=>{if(!isDemo&&sess?.casal_id)loadData(sess.casal_id);};

  if(showSplash)return<SplashScreen onSession={handleSession}/>;
  if(loadingData)return<LoadingScreen/>;
  if(!casal)return<LoadingScreen/>;
  if(!onboarded)return<Onboarding casal={casal} myRole={role} isDemo={isDemo} casalId={sess?.casal_id||"demo"} onDone={()=>{setOnboarded(true);setScreen("checkin");}}/>;

  const terapeutaPin=sess&&!sess.isDemo?getTPin(sess.casal_id):"";
  const shared={casal,active,setActive,go:setScreen,acordos,setAcordos,projetos,setProjetos,checkins,setCheckins,sessao,setSessao,isDemo,role};
  const OfflineBanner=loadError?<div style={{background:"#fff3cd",borderBottom:"1px solid #ffc107",padding:"10px 18px",display:"flex",alignItems:"center",justifyContent:"space-between"}}><span style={{fontSize:13,color:"#856404",fontFamily:SF}}>⚠ Sem conexão. Seus dados estão salvos.</span><button onClick={()=>sess?.casal_id&&loadData(sess.casal_id)} style={{background:"transparent",border:"1px solid #856404",borderRadius:8,padding:"4px 10px",fontSize:11,color:"#856404",cursor:"pointer",fontFamily:SF}}>Tentar novamente</button></div>:null;

  if(screen==="terapeuta"){if(!tOk)return<TPin onOk={()=>setTOk(true)} onBack={()=>setScreen("home")} pin={terapeutaPin}/>;return<TPanel casal={casal} acordos={acordos} checkins={checkins} projetos={projetos} marcos={marcos} go={s=>{if(s==="home")setTOk(false);setScreen(s);}}/>;};
  if(screen==="home")return<><div>{OfflineBanner}</div><Home {...shared} onSync={()=>sess?.casal_id&&loadData(sess.casal_id)} syncTime={syncTime} terapeutaPin={terapeutaPin} sessId={sess?.casal_id} marcos={marcos} onReminderCNV={(prefill)=>{setCnvPrefill(prefill);setScreen("cnv");}} onCreateMarco={(pf)=>{setHistoriaPrefill(pf);setScreen("historia");}}/></>;
  if(screen==="acordos")return<Acordos {...shared} onSaveAcordo={onSaveAcordo} customAreas={customAreas} setCustomAreas={setCustomAreas}/>;
  if(screen==="cnv")return<Comunicador {...shared} prefill={cnvPrefill} onClearPrefill={()=>setCnvPrefill(null)}/>;
  if(screen==="projetos")return<Projetos {...shared} onSaveProjeto={onSaveProjeto} onDelProjeto={onDelProjeto} onConvertMarco={(pf)=>{setHistoriaPrefill(pf);setScreen("historia");}}/>;
  if(screen==="checkin")return<Checkin {...shared} onSaveCheckin={onSaveCheckin}/>;
  if(screen==="enredo")return<MeuEnredo go={setScreen}/>;
  if(screen==="historia")return<NossaHistoria casal={casal} marcos={marcos} go={setScreen} isDemo={isDemo} role={role} onSaveMarco={onSaveMarco} prefill={historiaPrefill} onClearPrefill={()=>setHistoriaPrefill(null)} onGoToCNV={(pf)=>{setCnvPrefill(pf);setScreen("cnv");}}/>;
  if(screen==="leituras")return<Leituras casal={casal} go={setScreen} acordos={acordos}/>;
  if(screen==="historico")return<Historico casal={casal} go={setScreen} acordos={acordos}/>;
  return null;
}

/* ============ ERROR BOUNDARY ============ */
class ErrBoundary extends React.Component{
  constructor(p){super(p);this.state={err:false};}
  static getDerivedStateFromError(){return{err:true};}
  componentDidCatch(e,info){console.error("ErrBoundary:",e,info);}
  render(){
    if(this.state.err)return React.createElement("div",{style:{minHeight:"100vh",background:"linear-gradient(160deg,#1A2820,#2D4A3E)",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:24,textAlign:"center"}},
      React.createElement("div",{style:{fontSize:40,marginBottom:16}},"🌧️"),
      React.createElement("p",{style:{fontFamily:GF,color:"#fff",fontSize:20,marginBottom:8}},"Algo deu errado"),
      React.createElement("p",{style:{fontFamily:SF,color:"rgba(255,255,255,0.55)",fontSize:14,maxWidth:300,lineHeight:1.6,marginBottom:24}},"Seus dados estão salvos. Recarregue o app para continuar."),
      React.createElement("button",{onClick:()=>window.location.reload(),style:{background:"rgba(92,138,106,0.5)",border:"1.5px solid rgba(142,196,161,0.8)",borderRadius:50,padding:"12px 36px",color:"#fff",fontSize:14,fontWeight:600,cursor:"pointer",fontFamily:GF}},"Recarregar")
    );
    return this.props.children;
  }
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(ErrBoundary,null,React.createElement(App)));
</script>
